<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase JS SDK (ใช้แค่ Realtime Database ฟรี 100%) -->

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"IBM Plex Sans Thai"', 'ui-sans-serif', 'system-ui'] }

  <style>
    .scroll-thin::-webkit-scrollbar { width: 5px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    @keyframes pop { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .pop { animation: pop .2s cubic-bezier(0.16, 1, 0.3, 1); }
    .view-section { display: none; }
    .view-section.active { display: flex; animation: pop 0.25s ease-out; }
    #view-lobby.active { display: block; }
  </style>
</head>
<body class="font-sans antialiased text-slate-800 bg-slate-50 overflow-x-hidden">

  <!-- Image Lightbox Modal -->

  <!-- ==================== 1. LOGIN VIEW ==================== -->
  <div id="view-login" class="view-section min-h-screen items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 active">
    <div class="w-full max-w-sm bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white/20">
      <div class="flex flex-col items-center text-center mb-8">
        <div class="h-16 w-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-4 text-white font-bold text-2xl">
          TC
        </div>
        <h1 class="text-2xl font-bold text-slate-900">TeamChat</h1>
        <p class="text-slate-500 text-xs mt-1.5 font-medium">ระบบสื่อสารภายในทีมออนไลน์ (ฟรี 100%)</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">ชื่อที่จะแสดงในแชท</label>
          <input id="loginName" required maxlength="30" autofocus placeholder="เช่น สมชาย (ฝ่ายผลิต)"
            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm font-medium focus:bg-white focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 transition-all">
        </div>
        <button type="submit" class="w-full rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-semibold py-3.5 shadow-lg shadow-indigo-500/25 hover:brightness-110 active:scale-[0.98] transition-all">
          เข้าสู่ระบบ
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== 2. LOBBY VIEW ==================== -->
  <div id="view-lobby" class="view-section min-h-screen bg-slate-50/50">
    <header class="max-w-5xl mx-auto flex items-center justify-between px-4 py-6">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center shadow-md shadow-indigo-500/20 text-white font-bold">
          TC
        </div>
        <span class="text-xl font-bold text-slate-900">TeamChat</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2.5 bg-white rounded-full pl-1.5 pr-4 py-1.5 shadow-sm border border-slate-200/60">
          <span id="lobbyAvatar" class="avatar h-8 w-8 rounded-full flex items-center justify-center text-white text-xs font-bold"></span>
          <span id="lobbyName" class="text-sm font-semibold text-slate-700"></span>
        </div>
        <button id="logoutBtn" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-all" title="ออกจากระบบ">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>

    <main class="max-w-5xl mx-auto px-4 pb-16">
      <div class="mb-8">
        <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">สวัสดี, <span id="lobbyGreetingName" class="text-indigo-600"></span> 👋</h2>
        <p class="text-slate-500 text-sm mt-1">เข้าร่วมห้องสนทนาเดิม หรือสร้างห้องใหม่เพื่อเริ่มแชทงาน</p>
      </div>

      <div class="grid md:grid-cols-2 gap-6">
        <!-- Join Room -->
        <div class="bg-white rounded-3xl p-7 shadow-sm border border-slate-200/60 hover:shadow-md transition-all">
          <div class="flex items-center gap-3.5 mb-6">
            <div class="h-12 w-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
              <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
            </div>
            <div>
              <h3 class="font-bold text-lg text-slate-800">เข้าห้องแชท</h3>
              <p class="text-xs text-slate-400">กรอกรหัสห้อง 4 หลักจากเพื่อนร่วมงาน</p>
            </div>
          </div>
          <form id="joinForm">
            <div class="flex gap-2.5 justify-center mb-6">
              <input class="digit w-14 h-16 text-center text-2xl font-bold rounded-2xl border-2 border-slate-200 bg-slate-50/50 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 focus:outline-none transition-all" inputmode="numeric" maxlength="1" autocomplete="off">
              <input class="digit w-14 h-16 text-center text-2xl font-bold rounded-2xl border-2 border-slate-200 bg-slate-50/50 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 focus:outline-none transition-all" inputmode="numeric" maxlength="1" autocomplete="off">
              <input class="digit w-14 h-16 text-center text-2xl font-bold rounded-2xl border-2 border-slate-200 bg-slate-50/50 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 focus:outline-none transition-all" inputmode="numeric" maxlength="1" autocomplete="off">
              <input class="digit w-14 h-16 text-center text-2xl font-bold rounded-2xl border-2 border-slate-200 bg-slate-50/50 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 focus:outline-none transition-all" inputmode="numeric" maxlength="1" autocomplete="off">

            <button type="submit" class="w-full rounded-2xl bg-emerald-600 text-white font-semibold py-3.5 hover:bg-emerald-700 active:scale-[0.98] shadow-lg shadow-emerald-600/20 transition-all">

              <p class="text-xs text-slate-400">ระบบจะสร้างรหัสสุ่ม 4 หลักอัตโนมัติ</p>
            </div>
          </div>
          <form id="createForm" class="space-y-4">
            <input id="createRoomName" maxlength="50" placeholder="ตั้งชื่อห้อง เช่น ทีมออกแบบ, แจ้งเรื่องทั่วไป"
              class="w-full rounded-2xl border border-slate-200 bg-slate-50/50 px-4 py-3.5 text-sm font-medium focus:bg-white focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 transition-all">
            <button type="submit" class="w-full rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-semibold py-3.5 shadow-lg shadow-indigo-500/25 hover:brightness-110 active:scale-[0.98] transition-all">
              + สร้างห้องแชท

  </div>

  <!-- ==================== 3. ROOM VIEW ==================== -->
  <div id="view-room" class="view-section flex-col h-[100dvh] bg-slate-100/70">
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 py-3 flex items-center gap-3 shadow-sm z-20">
      <button id="backToLobbyBtn" class="h-10 w-10 rounded-2xl hover:bg-slate-100 flex items-center justify-center text-slate-500 transition-all">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div id="roomIcon" class="h-10 w-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 text-white flex items-center justify-center font-bold text-sm shadow-md shadow-indigo-500/20">
        ?
      </div>
      <div class="min-w-0 flex-1">
        <h1 id="roomTitle" class="font-bold text-slate-800 text-base truncate leading-tight">...</h1>
        <p class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span id="onlineCount" class="font-medium text-slate-600">1</span> คนออนไลน์

      <button id="copyBtn" class="flex items-center gap-2 rounded-2xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 px-3.5 py-2 text-xs font-semibold transition-all">
        <span class="hidden sm:inline text-slate-400">รหัสห้อง:</span>
        <span id="roomCodeDisplay" class="font-mono font-bold tracking-widest text-indigo-600">0000</span>
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      </button>
      
      <button id="membersBtn" class="lg:hidden h-10 w-10 rounded-2xl hover:bg-slate-100 flex items-center justify-center text-slate-500">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.4-1.8M17 20H7m10 0v-2c0-.7-.1-1.3-.4-1.8M7 20H2v-2a3 3 0 015.4-1.8M7 20v-2c0-.7.1-1.3.4-1.8m0 0a5 5 0 019.2 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>

    <div class="flex-1 flex min-h-0 relative">
      <div class="flex-1 flex flex-col min-w-0 bg-slate-100/50">
        <div id="messages" class="flex-1 overflow-y-auto scroll-thin px-4 sm:px-8 py-6 space-y-3"></div>

        <form id="composer" class="bg-white/90 backdrop-blur-md border-t border-slate-200/80 p-3 sm:p-4">
          <div class="flex flex-col gap-2 max-w-4xl mx-auto">
            
            <div id="attachMenu" class="hidden items-center gap-3 p-2 bg-white/95 rounded-2xl border border-slate-200/80 shadow-xl pop">
              <button type="button" id="btnAttachImg" class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold transition-all">
                <div class="p-1 rounded-lg bg-emerald-500 text-white">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                </div>
                ส่งรูปภาพ
              </button>
              
              <button type="button" id="btnAttachLoc" class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold transition-all">
                <div class="p-1 rounded-lg bg-rose-500 text-white">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                </div>
                แชร์พิกัด
              </button>
            </div>

            <input type="file" id="fileInputImg" accept="image/*" class="hidden">

            <div class="flex items-end gap-2.5">
              <button type="button" id="toggleAttachBtn" class="h-11 w-11 shrink-0 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center active:scale-95 transition-all" title="แนบสื่อ">
                <svg id="attachIcon" class="h-5 w-5 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              </button>

              <textarea id="inputMsg" rows="1" maxlength="2000" placeholder="พิมพ์ข้อความ..." 
                class="flex-1 resize-none max-h-36 rounded-2xl border border-slate-200 bg-slate-50/80 px-4 py-2.5 text-sm focus:bg-white focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 transition-all"></textarea>

              <button id="sendBtn" type="submit" class="h-11 w-11 shrink-0 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 text-white flex items-center justify-center shadow-md shadow-indigo-500/25 hover:brightness-110 active:scale-95 transition-all disabled:opacity-40">
                <svg class="h-5 w-5 rotate-90" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-7 7m7-7l7 7"/></svg>
              </button>
            </div>
          </div>
        </form>
      </div>

      <aside id="members" class="hidden lg:flex w-64 flex-col bg-white border-l border-slate-200/80 fixed lg:static inset-y-0 right-0 z-30 shadow-2xl lg:shadow-none">
        <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
          <h2 class="font-bold text-slate-800 text-sm">สมาชิกในห้องนี้</h2>
          <button id="closeMembers" class="lg:hidden text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button>
        </div>
        <ul id="memberList" class="flex-1 overflow-y-auto scroll-thin p-3 space-y-1"></ul>
      </aside>
    </div>
  </div>

  <script>
    // ⚠️ นำค่า Config จาก Firebase Console ของคุณมาวางตรงนี้
    const firebaseConfig = {
      apiKey: "AIzaSyCkg9SZtDOPdMk7zubtnxddBQt7_iN2czM",
      authDomain: "chatonline-bf7f5.firebaseapp.com",
      databaseURL: "https://chatonline-bf7f5-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "chatonline-bf7f5",
      storageBucket: "chatonline-bf7f5.firebasestorage.app",
      messagingSenderId: "337475955377",
      appId: "1:337475955377:web:76f7d82ef6d5f9257a1090"
    };

    let db;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch(e) {}

    const Auth = {
      getMe: () => localStorage.getItem('tc_user'),
      setMe: (name) => localStorage.setItem('tc_user', name),
      clearMe: () => localStorage.removeItem('tc_user')
    };

    let currentRoomCode = null;
    let currentMe = null;
    let msgListener = null;
    let presenceListener = null;
    let lastAuthor = null;
    let lastTime = 0;
    let lastDay = null;

    function showToast(msg, type = 'ok') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl shadow-xl text-xs font-semibold pop mb-2 flex items-center gap-2 ${
        type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white'
      }`;
      toast.innerHTML = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    function switchView(viewId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function paintAvatar(el) {
      const n = el.dataset.name || '?';
      const colors = ['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f97316','#22c55e','#14b8a6','#0ea5e9','#3b82f6'];
      let h = 0; for(const c of n) h = (h*31 + c.codePointAt(0)) >>> 0;
      el.style.background = colors[h % colors.length];
      el.innerHTML = '';
      el.appendChild(document.createTextNode([...n.trim()][0]?.toUpperCase() || '?'));
    }

    function compressImage(file, maxWidth = 650, quality = 0.6) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = e => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            let width = img.width, height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    }

    function encodeKey(str) { return encodeURIComponent(str).replace(/\./g, '%2E'); }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('loginName').value.trim();
      if (!name) return showToast('กรุณากรอกชื่อผู้ใช้', 'error');
      Auth.setMe(name);
      initApp();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      if(currentRoomCode && db) {
        db.ref(`presence/${currentRoomCode}/${encodeKey(currentMe)}`).remove();
      }
      Auth.clearMe();
      initApp();
    });

    const digits = [...document.querySelectorAll('.digit')];
    digits.forEach((d, i) => {
      d.addEventListener('input', () => {
        d.value = d.value.replace(/\D/g, '').slice(-1);
        if (d.value && i < 3) digits[i + 1].focus();
        if (digits.every(x => x.value)) handleJoin();
      });
      d.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !d.value && i > 0) { digits[i - 1].focus(); digits[i - 1].value = ''; }
        if (e.key === 'Enter') { e.preventDefault(); handleJoin(); }
      });
      d.addEventListener('paste', e => {
        const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
        if (t) {
          e.preventDefault();
          t.split('').forEach((c, k) => digits[k].value = c);
          (digits[t.length] || digits[3]).focus();
          if (t.length === 4) handleJoin();
        }
      });
    });

    async function handleJoin() {
      const code = digits.map(x => x.value).join('');
      if (code.length !== 4) return digits.find(x => !x.value)?.focus();
      if(db) {
        const snap = await db.ref(`rooms/${code}`).once('value');
        if(!snap.exists()) return showToast(`ไม่พบห้องรหัส ${code}`, 'error');
      }
      openRoom(code);
    }
    document.getElementById('joinForm').addEventListener('submit', e => { e.preventDefault(); handleJoin(); });

    document.getElementById('createForm').addEventListener('submit', async e => {
      e.preventDefault();
      const inputName = document.getElementById('createRoomName');
      const roomName = inputName.value.trim() || `ห้องแชทของ ${currentMe}`;
      const code = String(Math.floor(1000 + Math.random() * 9000));
      
      if(db) {
        await db.ref(`rooms/${code}`).set({ name: roomName, created_by: currentMe, created_at: Date.now() });
        await db.ref(`messages/${code}`).push({ author: null, body: `${currentMe} สร้างห้อง “${roomName}”`, created_at: Date.now() / 1000 });
      }
      
      showToast(`สร้างห้องสำเร็จ! รหัสห้องคือ ${code}`, 'ok');
      inputName.value = '';
      openRoom(code);
    });

    const box = document.getElementById('messages');
    const inputMsg = document.getElementById('inputMsg');
    const attachMenu = document.getElementById('attachMenu');
    const attachIcon = document.getElementById('attachIcon');

    function fmtTime(t) { return new Date(t * 1000).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }); }
    function fmtDay(t) {
      const d = new Date(t * 1000), today = new Date(), y = new Date(); y.setDate(today.getDate() - 1);
      if (d.toDateString() === today.toDateString()) return 'วันนี้';
      if (d.toDateString() === y.toDateString()) return 'เมื่อวาน';
      return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
    }
    function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

    function renderMessage(m) {
      const day = fmtDay(m.created_at);
      if (day !== lastDay) {
        const d = el('div', 'flex items-center gap-3 my-5 text-[11px] font-semibold text-slate-400');
        d.append(el('div', 'flex-1 h-px bg-slate-200/80'), el('span', 'px-3 py-1 bg-white rounded-full border border-slate-200/60 shadow-2xs', day), el('div', 'flex-1 h-px bg-slate-200/80'));
        box.append(d); lastDay = day; lastAuthor = null;
      }

      if (m.author === null) {
        const s = el('div', 'flex justify-center my-3 pop');
        s.append(el('span', 'text-xs bg-white/80 text-slate-500 px-3.5 py-1 rounded-full border border-slate-200/60 shadow-2xs', m.body));
        box.append(s); lastAuthor = null; return;
      }

      const mine = m.author === currentMe;
      const grouped = m.author === lastAuthor && (m.created_at - lastTime) < 180;
      const row = el('div', `flex gap-2.5 pop ${mine ? 'justify-end' : ''} ${grouped ? 'mt-0.5' : 'mt-3.5'}`);
      
      if (!mine) {
        const av = el('div', 'avatar h-8 w-8 shrink-0 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-2xs');
        av.dataset.name = m.author; paintAvatar(av);
        if (grouped) av.style.visibility = 'hidden';
        row.append(av);
      }

      const col = el('div', `flex flex-col max-w-[82%] sm:max-w-[68%] ${mine ? 'items-end' : 'items-start'}`);
      if (!grouped && !mine) col.append(el('span', 'text-[11px] font-semibold text-slate-500 mb-1 ml-1', m.author));
      
      let bubble;

      if (m.type === 'image') {
        bubble = el('div', `p-1.5 rounded-2xl overflow-hidden shadow-sm border ${mine ? 'bg-indigo-600 border-indigo-500' : 'bg-white border-slate-200/80'}`);
        const img = el('img', 'max-w-full rounded-xl cursor-pointer hover:opacity-95 transition-all max-h-80 object-cover');
        img.src = m.mediaUrl;
        img.onclick = () => {
          document.getElementById('modalImg').src = m.mediaUrl;
          document.getElementById('imageModal').classList.remove('hidden');
          document.getElementById('imageModal').classList.add('flex');
        };
        bubble.append(img);
      } 
      else if (m.type === 'location') {
        bubble = el('div', `p-3 rounded-2xl shadow-sm border w-60 ${mine ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-white text-slate-800 border-slate-200/80'}`);
        const mapUrl = `https://www.google.com/maps?q=${m.lat},${m.lng}`;
        bubble.innerHTML = `
          <div class="flex items-center gap-2.5 mb-2.5">
            <div class="h-8 w-8 shrink-0 rounded-xl ${mine ? 'bg-white/20' : 'bg-rose-50 text-rose-500'} flex items-center justify-center">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="min-w-0">
              <p class="text-xs font-bold">พิกัดตำแหน่ง</p>
              <p class="text-[10px] opacity-75">${m.lat.toFixed(4)}, ${m.lng.toFixed(4)}</p>
            </div>
          </div>
          <a href="${mapUrl}" target="_blank" rel="noopener" class="block w-full text-center py-1.5 rounded-xl text-xs font-semibold ${mine ? 'bg-white/20 hover:bg-white/30 text-white' : 'bg-rose-50 hover:bg-rose-100 text-rose-600'} transition-all">
            เปิดบน Google Maps
          </a>
        `;
      } 
      else {
        bubble = el('div', `px-4 py-2.5 rounded-2xl text-xs sm:text-sm whitespace-pre-wrap break-words leading-relaxed shadow-2xs ${
          mine ? 'bg-gradient-to-tr from-indigo-600 to-violet-600 text-white rounded-br-xs' : 'bg-white text-slate-800 rounded-bl-xs border border-slate-200/80'
        }`, m.body);
      }

      bubble.title = fmtTime(m.created_at);
      const wrap = el('div', `flex items-end gap-1.5 ${mine ? 'flex-row-reverse' : ''}`);
      wrap.append(bubble, el('span', 'text-[9px] font-medium text-slate-400 mb-0.5 shrink-0', fmtTime(m.created_at)));
      
      col.append(wrap); row.append(col); box.append(row);
      lastAuthor = m.author; lastTime = m.created_at;
    }

    async function openRoom(code) {
      currentRoomCode = code;
      document.getElementById('roomCodeDisplay').textContent = code;
      
      if(db) {
        const roomSnap = await db.ref(`rooms/${code}`).once('value');
        const roomData = roomSnap.val() || { name: `ห้อง #${code}` };
        document.getElementById('roomTitle').textContent = roomData.name;
        document.getElementById('roomIcon').textContent = roomData.name.charAt(0);

        const myPresenceRef = db.ref(`presence/${code}/${encodeKey(currentMe)}`);
        myPresenceRef.set({ name: currentMe, online: true });
        myPresenceRef.onDisconnect().remove();

        if(presenceListener) db.ref(`presence/${code}`).off('value', presenceListener);
        presenceListener = db.ref(`presence/${code}`).on('value', snap => {
          const members = snap.val() || {};
          const list = Object.values(members);
          document.getElementById('onlineCount').textContent = list.length;
          
          const ul = document.getElementById('memberList'); ul.innerHTML = '';
          list.forEach(m => {
            const li = el('li', 'flex items-center gap-3 px-2 py-2 rounded-xl hover:bg-slate-50 transition-all');
            const av = el('div', 'avatar relative h-8 w-8 rounded-full flex items-center justify-center text-white text-xs font-bold');
            av.dataset.name = m.name; paintAvatar(av);
            av.append(el('span', 'absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full bg-emerald-500 ring-2 ring-white'));
            li.append(av, el('span', 'text-xs font-semibold text-slate-700 truncate', m.name + (m.name === currentMe ? ' (คุณ)' : '')));
            ul.append(li);
          });
        });

        box.innerHTML = '';
        lastAuthor = null; lastTime = 0; lastDay = null;
        if(msgListener) db.ref(`messages/${code}`).off('child_added', msgListener);
        msgListener = db.ref(`messages/${code}`).on('child_added', snap => {
          renderMessage(snap.val());
          box.scrollTop = box.scrollHeight;
        });
      }

      switchView('view-room');
    }

    document.getElementById('toggleAttachBtn').addEventListener('click', () => {
      attachMenu.classList.toggle('hidden');
      attachMenu.classList.toggle('flex');
      attachIcon.classList.toggle('rotate-45');
    });

    document.getElementById('btnAttachImg').addEventListener('click', () => document.getElementById('fileInputImg').click());
    document.getElementById('fileInputImg').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        showToast('กำลังประมวลผลรูปภาพ...', 'ok');
        const compressedBase64 = await compressImage(file);

        db.ref(`messages/${currentRoomCode}`).push({
          author: currentMe,
          type: 'image',
          mediaUrl: compressedBase64,
          created_at: Date.now() / 1000
        });
        
        attachMenu.classList.add('hidden'); attachMenu.classList.remove('flex'); attachIcon.classList.remove('rotate-45');
      } catch (err) {
        showToast('ไม่สามารถส่งรูปภาพได้', 'error');
      }
      e.target.value = '';
    });

    document.getElementById('btnAttachLoc').addEventListener('click', () => {
      if (!navigator.geolocation) return showToast('เบราว์เซอร์ไม่รองรับ GPS', 'error');
      showToast('กำลังดึงตำแหน่งพิกัดของคุณ...', 'ok');
      
      navigator.geolocation.getCurrentPosition((pos) => {
        db.ref(`messages/${currentRoomCode}`).push({
          author: currentMe,
          type: 'location',
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          created_at: Date.now() / 1000
        });
        attachMenu.classList.add('hidden'); attachMenu.classList.remove('flex'); attachIcon.classList.remove('rotate-45');
      }, () => showToast('ไม่สามารถระบุตำแหน่งได้', 'error'));
    });

    document.getElementById('composer').addEventListener('submit', e => {
      e.preventDefault();
      const body = inputMsg.value.trim(); if (!body) return;
      
      if(db) {
        db.ref(`messages/${currentRoomCode}`).push({
          author: currentMe,
          type: 'text',
          body: body,
          created_at: Date.now() / 1000
        });
      }
      inputMsg.value = '';
      inputMsg.style.height = 'auto';
      inputMsg.focus();
    });

    inputMsg.addEventListener('input', () => {
      inputMsg.style.height = 'auto';
      inputMsg.style.height = Math.min(inputMsg.scrollHeight, 140) + 'px';
    });
    inputMsg.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        document.getElementById('composer').dispatchEvent(new Event('submit'));
      }
    });

    document.getElementById('backToLobbyBtn').addEventListener('click', () => {
      if(db && currentRoomCode) {
        db.ref(`presence/${currentRoomCode}/${encodeKey(currentMe)}`).remove();
      }
      currentRoomCode = null;
      initApp();
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(currentRoomCode); } catch (_) {}
      showToast('คัดลอกรหัสห้องแล้ว', 'ok');
    });

    document.getElementById('imageModal').addEventListener('click', () => {
      document.getElementById('imageModal').classList.add('hidden');
      document.getElementById('imageModal').classList.remove('flex');
    });

    const membersSidebar = document.getElementById('members');
    document.getElementById('membersBtn').addEventListener('click', () => { membersSidebar.classList.remove('hidden'); membersSidebar.classList.add('flex'); });
    document.getElementById('closeMembers').addEventListener('click', () => { membersSidebar.classList.add('hidden'); membersSidebar.classList.remove('flex'); });

    function initApp() {
      currentMe = Auth.getMe();
      if (!currentMe) {
        switchView('view-login');
        document.getElementById('loginName').value = '';
      } else {
        document.getElementById('lobbyName').textContent = currentMe;
        document.getElementById('lobbyGreetingName').textContent = currentMe;
        const av = document.getElementById('lobbyAvatar');
        av.dataset.name = currentMe;
        paintAvatar(av);
        digits.forEach(d => d.value = '');
        switchView('view-lobby');
      }
    }

    initApp();
  </script>
</body>
</html>
